name: 'web-lib-test'

x-php-service: &php-service
  build: &php-build
    additional_contexts:
      source: ../.
    args:
      - PHP_VERSION
    target: php_test

services:
  php-83:
    <<: *php-service
    build:
      <<: *php-build
      args:
        PHP_VERSION: 8.3
    command: ["run-tests", "coverage"]
    environment:
      XDEBUG_MODE: coverage
  php-82:
    <<: *php-service
    build:
      <<: *php-build
      args:
        PHP_VERSION: 8.2
    depends_on:
      php-83:
        condition: service_completed_successfully
  export-package:
    build:
      args:
        PHP_VERSION: 8.3
      target: php_dev
    command: ["php", ".docker/check-export.php"]
    environment:
      XDEBUG_MODE: off
    volumes:
      - ../.:/usr/src/app/:ro
